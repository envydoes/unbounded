<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unbounded | Test Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
    }
    h1 { font-size: 2.2rem; margin-bottom: 12px; }
    p { opacity: 0.85; line-height: 1.6; margin-bottom: 8px; }
    .ok { color: #4ade80; font-weight: 600; margin-top: 16px; }
    code { background: rgba(0, 0, 0, 0.3); padding: 2px 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Unbounded 🚀</h1>
    <p>If you can see this page, GitHub Pages is working.</p>
    <p>Current address: <code id="url"></code></p>
    <p class="ok">✅ Deployment successful</p>
  </div>
  <script>
    document.getElementById("url").textContent = window.location.href;
  </script>
</body>
</html>
